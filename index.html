<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Clicker exempel</title>
</head>

<body>
    <audio id="swoosh" src="assets/audio/607251__d4xx__swoosh-2.wav"></audio>
    <main class="game-interface">
        <div class="left flow">
            <h1>Title</h1>
            <p><span id="resource">0</span> <span id="resource-name">resource</span></p>
            <p><span id="resource-per-second">0</span> per second</p>
            <div class="button-container">
                <button id="game-button" class="game-button">
                    <img src="/assets/icons/settings_48dp_1F1F1F_FILL1_wght400_GRAD0_opsz48.svg" alt="Settings icon">
                </button>
            </div>
        </div>
        <div class="middle flow">
            <div id="stats">
                <ul class="stats-list">
                </ul>
                <template id="stats-item-template">
                    <li class="stats-item">
                        <p class="stats-value"></p>
                    </li>
                </template>
            </div>
            <div id="purchased-buildings">
                <h3>Köpta Byggnader</h3>
                <ul class="building-list"></ul>
                <template id="building-item-template">
                    <li class="building-item">
                        <span class="icon"></span>
                    </li>
                </template>
            </div>
        </div>
        <div class="right store flow">
            <h2>Store</h2>
            <ul id="building-list" class="store-buildings"></ul>
            <template id="store-item-template">
                <li class="store-item">
                    <button class="store-item-button">
                        <div class="store-item-icon"></div>
                        <div class="store-item-details">
                            <h3 class="store-item-title"></h3>
                            <p class="store-item-cost"></p>
                        </div>
                    </button>
                    <div class="store-tooltip">
                        <p class="store-tooltip-lore"></p>
                        <p class="store-tooltip-description"></p>
                    </div>
                </li>
            </template>
        </div>
    </main>
    <footer>
        <p>Find the code on <a href="https://github.com/jensadev/wu1-clicker">Github</a>.</p>
    </footer>
    <div id="message-container">
        <template id="message-template">
            <div class="message">
                <p class="message-icon"></p>
                <p class="message-text"></p>
            </div>
        </template>
    </div>
    <script type="module" src="js/clicker.js"></script>
</body>

</html>
