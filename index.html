<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Clicker exempel</title>
</head>

<body>
    <audio id="swoosh" src="assets/audio/607251__d4xx__swoosh-2.wav"></audio>
    <main class="game-hud">
      <div class="left">
        <h1>Title</h1>
        <p><span id="money-display">0</span> <span id="money-display-name">money</span></p>
        <p><span id="carbon-display">0</span>carbon</p>
        <div class='buttonWrap'>
          <button class='theButton particleButton'>Click me</button>
          <div class='theButton particleButton particles'></div>
        </div>
        <div class="button-container">
          <button id="click-button" class="bubbly-button">
            <img src="assets/icons/co2_48dp_1F1F1F_FILL0_wght400_GRAD0_opsz48.svg" alt="co2">
          </button>
        </div>
      </div>
      <div class="middle">
        <div id="msgbox"></div>
        <ul id="upgrades-display"></ul>
        <div id="achivements"></div>
      </div>
      <div class="right store">
        <h1>Store</h1>
        <ul id="upgrade-list" class="store-upgrades"></ul>
        <ul id="building-list" class="store-buildings"></ul>
      </div>
    </main>
    <script type="module" src="js/clicker.js"></script>
</body>

</html>
